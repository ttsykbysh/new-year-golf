<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>new-year-golf</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #0b6623;
      color: white;
      padding: 20px;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    #start { background: #ffd700; }
    #reset { background: #ff6347; }
    #distance {
      font-size: 32px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🏌️ new-year-golf</h1>

<button id="start">クラブを振って！</button>
<button id="reset">やっぱり止める！</button>

<div id="distance">0 ヤード</div>

<script>
let measuring = false;
let peakAccel = 0;
let swingStart = null;
let swingDuration = 0;

function magnitude(x, y, z) {
  return Math.sqrt(x*x + y*y + z*z);
}

document.getElementById("start").onclick = async () => {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    const permission = await DeviceMotionEvent.requestPermission();
    if (permission !== 'granted') return;
  }

  measuring = true;
  peakAccel = 0;
  swingStart = null;
  swingDuration = 0;
  document.getElementById("distance").textContent = "計測中…";
};

document.getElementById("reset").onclick = () => {
  measuring = false;
  document.getElementById("distance").textContent = "0 ヤード";
};

window.addEventListener("devicemotion", (event) => {
  if (!measuring) return;

  // ★重力を除外
  const a = event.acceleration;
  if (!a) return;

  const mag = magnitude(a.x || 0, a.y || 0, a.z || 0);

  // スイング開始判定
  if (mag > 25) {
    if (!swingStart) swingStart = Date.now();
    peakAccel = Math.max(peakAccel, mag);
  }

  // スイング中
  if (swingStart) {
    swingDuration = Date.now() - swingStart;

    // 計測上限 600ms
    if (swingDuration > 600) finishSwing();
  }
});

function finishSwing() {
  measuring = false;

  // 成立条件チェック
  if (peakAccel < 30 || swingDuration < 150) {
    document.getElementById("distance").textContent = "0 ヤード";
    return;
  }

  // ★飛距離計算（簡単に300行かない）
  let power = Math.sqrt(peakAccel - 25);
  let distance = power * (swingDuration / 100) * 18;

  distance = Math.min(300, Math.floor(distance));
  document.getElementById("distance").textContent =
    distance + " ヤード";
}
</script>


</body>
</html>
