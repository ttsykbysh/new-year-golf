<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新春ドラコン大会 始まるよ！</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Kaisei Decol', serif;
      text-align: center;
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    h1 {
      font-size: 30px;
      line-height: 1.3;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 20px;
    }

    /* ★ 画面端に余白を作る */
    .players {
      display: flex;
      justify-content: space-between;
      max-width: 420px;
      margin: 10px auto 0;
      padding: 0 20px;
      gap: 20px;
    }

    .player-btn {
      border: 4px solid transparent;
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      transition: transform 0.2s, border 0.2s;
      width: 180px;
    }

    .player-btn:hover {
      transform: scale(1.05);
      border-color: gold;
    }

    .player-btn img {
      width: 160px;
      display: block;
      margin: 0 auto;
    }

    .label {
      margin-top: 8px;
      font-size: 16px;
    }

    .selected {
      border-color: gold;
    }

    button {
      font-family: 'Kaisei Decol', serif;
      font-size: 20px;
      padding: 14px 28px;
      margin: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #start {
      background: #ffd700;
      color: #000;
    }

    #reset {
      background: #ff6347;
      color: #fff;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #distance {
      font-size: 30px;
      margin-top: 20px;
      text-shadow: 2px 2px 4px #000;
    }
  </style>
</head>
<body>

<h1>
  🎍 新春ドラコン大会<br>
  始まるよ！
</h1>

<!-- プレイヤー選択 -->
<div id="playerSelect" class="players"></div>

<!-- 操作ボタン -->
<button id="start" disabled>スイングする！</button>
<button id="reset">やり直したい！</button>

<div id="distance">プレイヤーを選んで！</div>

      </div>
      <div class="player-btn" data-player="pro">
        <img src="Player_B.png" alt="プロゴルファー">
        <div class="label">プロです！</div>
      </div>
    `;

    document.querySelectorAll(".player-btn").forEach(btn => {
      btn.addEventListener("click", () => selectPlayer(btn));
    });
  }

    playerType = btn.dataset.player;

    playerSelect.innerHTML = "";
    btn.classList.add("selected");

    distanceEl.textContent = "スイングする！を押してスイング！！";
  }
