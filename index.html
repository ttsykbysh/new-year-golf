<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新春ドラコン大会 始まるよ！</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Kaisei Decol', serif;
      text-align: center;
      background: url("sky-and-green.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    h1 {
      font-size: 30px;
      line-height: 1.3;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 20px;
    }

    .players {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 10px;
    }

    .player-btn {
      border: 4px solid transparent;
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      transition: transform 0.2s, border 0.2s;
      width: 180px;
    }

    .player-btn:hover {
      transform: scale(1.05);
      border-color: gold;
    }

    .player-btn img {
      width: 144px;
      display: block;
      margin: 0 auto;
    }

    .label {
      margin-top: 8px;
      font-size: 16px;
    }

    .selected {
      border-color: gold;
    }

    button {
      font-family: 'Kaisei Decol', serif;
      font-size: 20px;
      padding: 14px 28px;
      margin: 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    #start { background: #ffd700; color: #000; }
    #reset { background: #ff6347; color: #fff; }
    #end { background: #4169e1; color: #fff; }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #distance {
      font-size: 30px;
      margin-top: 20px;
      text-shadow: 2px 2px 4px #000;
    }
  </style>
</head>
<body>

<h1>
  🎍 新春ドラコン大会<br>
  始まるよ！
</h1>

<div id="playerSelect" class="players"></div>

<button id="start" disabled>スイングする！</button>
<button id="reset">やり直したい！</button>
<button id="end">終わりにする！</button>

<div id="distance">プレイヤーを選んで！</div>

<script>
  let measuring = false;
  let peakAccel = 0;
  let swingStart = null;
  let accelSamples = [];
  let playerType = null;
  let swingAudio = null;
  let selectAudio = null;
  let endAudio = null;

  const playerSelect = document.getElementById("playerSelect");
  const startBtn = document.getElementById("start");
  const distanceEl = document.getElementById("distance");

  function magnitude(x, y, z) {
    return Math.sqrt(x*x + y*y + z*z);
  }

  function initPlayerSelect() {
    playerSelect.innerHTML = `
      <div class="player-btn" data-player="ama">
        <img src="Player_A.png" alt="アマチュア">
        <div class="label">アマです！</div>
      </div>
      <div class="player-btn" data-player="pro">
        <img src="Player_B.png" alt="プロゴルファー">
        <div class="label">プロです！</div>
      </div>
    `;

    document.querySelectorAll(".player-btn").forEach(btn => {
      btn.addEventListener("click", () => selectPlayer(btn));
    });
  }

  function selectPlayer(btn) {
    playerType = btn.dataset.player;

    // ★ プレイヤー選択音
    const selectFile = playerType === "pro"
      ? "p_select.mp3"
      : "a_select.mp3";

    selectAudio = new Audio(selectFile);
    selectAudio.play();

    playerSelect.innerHTML = "";
    btn.classList.add("selected");
    playerSelect.appendChild(btn);

    startBtn.disabled = false;
    distanceEl.textContent = "スイングする！を押してスイング！！";
  }

  function fullReset() {
    measuring = false;
    playerType = null;
    startBtn.disabled = true;
    distanceEl.textContent = "プレイヤーを選んで！";
    initPlayerSelect();

    if (swingAudio) {
      swingAudio.pause();
      swingAudio.currentTime = 0;
    }
  }

  initPlayerSelect();

  startBtn.onclick = async () => {
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const permission = await DeviceMotionEvent.requestPermission();
      if (permission !== "granted") return;
    }

    measuring = true;
    peakAccel = 0;
    swingStart = null;
    accelSamples = [];
    distanceEl.textContent = "計測中…";
  };

  document.getElementById("reset").onclick = fullReset;

  document.getElementById("end").onclick = () => {
    fullReset();
    endAudio = new Audio("end.mp3");
    endAudio.play();
  };

  window.addEventListener("devicemotion", (event) => {
    if (!measuring) return;

    const a = event.acceleration;
    if (!a) return;

    const mag = magnitude(a.x || 0, a.y || 0, a.z || 0);

    if (mag > 22) {
      if (!swingStart) swingStart = Date.now();
      peakAccel = Math.max(peakAccel, mag);
      accelSamples.push(mag);
    }

    if (swingStart && Date.now() - swingStart > 700) {
      finishSwing();
    }
  });

  function finishSwing() {
    measuring = false;

    const duration = accelSamples.length * 16;

    const params = playerType === "pro"
      ? { accelMin: 28, baseOffset: 24, power: 1.35, multiplier: 1.45 }
      : { accelMin: 32, baseOffset: 28, power: 1.25, multiplier: 1.2 };

    let distance = 0;

    if (peakAccel >= params.accelMin && duration >= 180) {
      const avg = accelSamples.reduce((a, b) => a + b, 0) / accelSamples.length;
      const variance =
        accelSamples.reduce((a, b) => a + Math.pow(b - avg, 2), 0) /
        accelSamples.length;

      const stability = Math.max(0.45, 1 - variance / 120);
      const basePower = Math.pow(peakAccel - params.baseOffset, params.power);
      const timeFactor = Math.min(1.1, duration / 400);

      distance = Math.min(
        300,
        Math.floor(basePower * timeFactor * stability * params.multiplier)
      );
    }

    distanceEl.textContent = distance + " ヤード";

    const audioFile = playerType === "pro"
      ? "p_swing.mp3"
      : "a_swing.mp3";

    swingAudio = new Audio(audioFile);
    swingAudio.play();
  }
</script>

</body>
</html>
