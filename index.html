<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新春ドラコン大会、始まるよ！</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Kaisei Decol -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Kaisei Decol', serif;
      text-align: center;
      background: url("background.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #000;
    }

    img {
      width: 180px;
      margin: 15px 0;
    }

    button {
      font-family: 'Kaisei Decol', serif;
      font-size: 18px;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 10px;
      border: none;
    }

    #select {
      background: #1e90ff;
      color: white;
    }

    #start {
      background: #ffd700;
      color: black;
    }

    #reset {
      background: #ff6347;
      color: white;
    }

    button:disabled {
      background: #888;
    }

    #distance {
      font-size: 32px;
      margin-top: 20px;
      text-shadow: 2px 2px 4px #000;
    }
  </style>
</head>
<body>

<h1>🎍 新春ドラコン大会、始まるよ！</h1>

<img src="Player_A.png" alt="プレイヤーA">

<br>

<button id="select">プレイヤーを選ぶ</button>
<br>
<button id="start" disabled>クラブを振って！</button>
<button id="reset">やっぱり止める！</button>

<div id="distance">0 ヤード</div>

<script>
let measuring = false;
let peakAccel = 0;
let swingStart = null;
let swingDuration = 0;

function magnitude(x, y, z) {
  return Math.sqrt(x*x + y*y + z*z);
}

// プレイヤー選択
document.getElementById("select").onclick = () => {
  document.getElementById("start").disabled = false;
  document.getElementById("distance").textContent = "準備OK！";
};

// 計測開始
document.getElementById("start").onclick = async () => {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    const permission = await DeviceMotionEvent.requestPermission();
    if (permission !== 'granted') return;
  }

  measuring = true;
  peakAccel = 0;
  swingStart = null;
  swingDuration = 0;
  document.getElementById("distance").textContent = "計測中…";
};

// リセット
document.getElementById("reset").onclick = () => {
  measuring = false;
  document.getElementById("distance").textContent = "0 ヤード";
};

// モーション検出
window.addEventListener("devicemotion", (event) => {
  if (!measuring) return;

  const a = event.acceleration; // 重力除外
  if (!a) return;

  const mag = magnitude(a.x || 0, a.y || 0, a.z || 0);

  if (mag > 25) {
    if (!swingStart) swingStart = Date.now();
    peakAccel = Math.max(peakAccel, mag);
  }

  if (swingStart) {
    swingDuration = Date.now() - swingStart;
    if (swingDuration > 600) finishSwing();
  }
});

function finishSwing() {
  measuring = false;

  if (peakAccel < 30 || swingDuration < 150) {
    document.getElementById("distance").textContent = "0 ヤード";
    return;
  }

  let power = Math.sqrt(peakAccel - 25);
  let distance = power * (swingDuration / 100) * 18;

  distance = Math.min(300, Math.floor(distance));
  document.getElementById("distance").textContent =
    distance + " ヤード";
}
</script>

</body>
</html>
